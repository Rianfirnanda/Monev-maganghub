name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Prebuilt APK
        run: |
          mkdir -p output-apk
          if [ -f "Monev-MagangHub.apk" ]; then
            cp Monev-MagangHub.apk output-apk/Monev-MagangHub.apk
          elif [ -f "APK-SIAP-INSTALL/Monev-MagangHub.apk" ]; then
            cp APK-SIAP-INSTALL/Monev-MagangHub.apk output-apk/Monev-MagangHub.apk
          elif [ -f ".build-outputs/app-debug.apk" ]; then
            cp .build-outputs/app-debug.apk output-apk/Monev-MagangHub.apk
          fi

      - name: Upload Monev MagangHub APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Monev-MagangHub-APK
          path: output-apk/Monev-MagangHub.apk
